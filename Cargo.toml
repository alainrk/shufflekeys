[package]
name = "shufflekeys"
version = "0.1.0"
edition = "2021"
authors = ["Alain"]
description = "Keystroke dynamics obfuscation tool — defeat typing biometric fingerprinting"
license = "MIT"
readme = "README.md"

[[bin]]
name = "shufflekeys"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
rand = "0.8"
rand_distr = "0.4"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
dirs = "5"
nix = { version = "0.29", features = ["ioctl", "time", "signal", "fs", "process"] }
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.12"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
core-foundation = "0.10"
foreign-types = "0.5"
